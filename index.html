<script>
(function () {
  const GOOGLE_SCRIPT_URL = "DAN_LINK_WEB_APP_CUA_BAN_VAO_DAY";
  const wishesContainer = document.getElementById("wishesContainer");
  const guestbookForm = document.getElementById("guestbookForm");
  const rsvpForm = document.getElementById("rsvpForm");

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function sendToSheet(payload) {
    if (!GOOGLE_SCRIPT_URL.startsWith("http")) return;
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  }

  // 1. Tải toàn bộ lời chúc từ Cột E (Lời chúc) hiển thị công khai lên web
  async function loadSharedWishes() {
    if (!wishesContainer || !GOOGLE_SCRIPT_URL.startsWith("http")) return;
    try {
      const res = await fetch(GOOGLE_SCRIPT_URL);
      const list = await res.json();
      if (Array.isArray(list) && list.length > 0) {
        wishesContainer.innerHTML = list.map(function (item) {
          return '<div class="p-3.5 rounded-2xl bg-ivory border border-champagne/20 space-y-1">' +
            '<div class="flex items-center justify-between gap-2">' +
              '<p class="font-times-clean text-xs font-bold text-misty">♥ ' + escapeHTML(item.name) + '</p>' +
              '<span class="font-times-clean text-[10px] text-taupe">' + escapeHTML(item.time) + '</span>' +
            '</div>' +
            '<p class="font-times-clean text-xs sm:text-sm text-ink leading-relaxed">' + escapeHTML(item.message) + '</p>' +
          '</div>';
        }).join("");
      }
    } catch (e) {}
  }

  // 2. Gửi dữ liệu từ Sổ Lưu Bút về Google Sheets
  if (guestbookForm) {
    guestbookForm.addEventListener("submit", function () {
      const nameEl = document.getElementById("guestNameInput");
      const wishEl = document.getElementById("guestWishInput");
      const name = nameEl ? nameEl.value.trim() : "";
      const message = wishEl ? wishEl.value.trim() : "";
      if (!name || !message) return;

      sendToSheet({
        name: name,
        status: "Gửi lời chúc",
        count: 0,
        message: message,
        note: "Sổ lưu bút"
      });
    }, true);
  }

  // 3. Gửi dữ liệu từ Form Xác Nhận Tham Dự (RSVP) về Google Sheets
  if (rsvpForm) {
    rsvpForm.addEventListener("submit", function () {
      const nameEl = document.getElementById("rsvpName");
      const sideEl = document.getElementById("rsvpSide");
      const statusEl = document.getElementById("rsvpStatus");
      const countEl = document.getElementById("rsvpCount");
      const wishEl = document.getElementById("rsvpWish");

      const name = nameEl ? nameEl.value.trim() : "";
      if (!name) return;

      const status = statusEl ? statusEl.value : "Sẽ tham dự";
      let count = 1;
      if (status.toLowerCase().includes("tiếc") || status.toLowerCase().includes("không")) {
        count = 0;
      } else if (countEl) {
        const match = String(countEl.value).match(/\d+/);
        count = match ? parseInt(match[0], 10) : 1;
      }

      sendToSheet({
        name: name,
        status: status,
        count: count,
        message: wishEl ? wishEl.value.trim() : "",
        note: sideEl ? sideEl.value : "Xác nhận tham dự"
      });
    }, true);
  }

  loadSharedWishes();
})();
</script>https://script.google.com/macros/s/AKfycbwk1qSacj6sG7mhGVJx-VpkK9ZTaVf_bDuNPVwGvJ8MclG-ah9Xon8ckwvL_BTVtct7xg/exec
